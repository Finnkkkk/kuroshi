<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuroshi — Streaming de Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#ffffff;
    --bg-1:#f5f4f1;
    --bg-2:#ececE8;
    --panel:#0d0d0d;
    --line:#e3e1db;
    --line-strong:#111111;
    --ink:#111111;
    --ink-dim:#68655f;
    --ink-faint:#a5a29a;
    --accent:#c8102e;
    --accent-ink:#ffffff;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%;}
  h1,h2,h3,.display{
    font-family:'Archivo Black','Archivo',system-ui,sans-serif;
    font-weight:400;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent);color:#fff;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  #app{min-height:100vh;display:flex;flex-direction:column;}

  header.topbar{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:space-between;
    padding:22px clamp(20px,4vw,56px);border-bottom:1px solid var(--line);gap:24px;
  }
  .brand{display:flex;flex-direction:column;line-height:1;gap:4px;}
  .brand b{font-family:'Archivo Black';font-size:19px;letter-spacing:.01em;}
  .brand small{font-size:9px;letter-spacing:.22em;color:var(--accent);font-weight:700;}
  nav.mainnav{display:flex;gap:34px;}
  nav.mainnav a{
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);
    padding:4px 0;border-bottom:1px solid transparent;
  }
  nav.mainnav a:hover{color:var(--ink);}
  nav.mainnav a.active{color:var(--ink);border-color:var(--ink);}
  .topbar-actions{display:flex;align-items:center;gap:14px;}
  .search-wrap{position:relative;}
  .search-wrap input{
    background:var(--bg-1);border:1px solid var(--line);color:var(--ink);
    padding:8px 12px 8px 32px;border-radius:2px;font-size:12px;width:150px;
    transition:width .2s ease,border-color .2s ease;
  }
  .search-wrap input:focus{width:210px;border-color:var(--ink);}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;}
  .icon-sq{
    width:38px;height:38px;border:1px solid var(--line-strong);background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .icon-sq:hover{background:var(--accent);border-color:var(--accent);}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
  }

  main{flex:1;}

  footer.sitefoot{
    border-top:1px solid var(--line);padding:30px clamp(20px,4vw,56px);
    color:var(--ink-faint);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }

  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border:none;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;transition:transform .12s ease, background .15s ease, color .15s ease;border-radius:1px;}
  .btn:active{transform:scale(.97);}
  .btn-solid{background:var(--ink);color:#fff;}
  .btn-solid:hover{background:var(--accent);}
  .btn-outline{background:#fff;border:1.5px solid var(--ink);color:var(--ink);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent);}
  .btn-sm{padding:8px 15px;font-size:11px;}
  .icon-round{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;background:#fff;flex:0 0 auto;}
  .icon-round:hover{border-color:var(--accent);color:var(--accent);}
  .icon-round.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  .feature{
    display:grid;grid-template-columns:1.15fr 1fr;min-height:640px;border-bottom:1px solid var(--line);
  }
  @media (max-width:860px){.feature{grid-template-columns:1fr;min-height:auto;}}

  /* Hero: fundo borrado (preenche qualquer proporção de imagem sem
     esticar feio) + capa nítida em caixa própria, com fallback pro
     emblema SVG quando não há capa real (modo mock/dados ausentes). */
  .feature-art{
    position:relative;overflow:hidden;background:var(--bg-1);
    display:flex;align-items:flex-end;padding:28px;
    aspect-ratio:16/9;
  }
  @media (min-width:861px){.feature-art{aspect-ratio:auto;height:100%;}}
  @media (max-width:640px){.feature-art{aspect-ratio:4/3;padding:18px;}}
  .feature-art .backdrop{
    position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;
    filter:blur(28px) saturate(1.15) brightness(.75);transform:scale(1.05);
  }
  .feature-art .backdrop-tint{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55) 88%);}
  .feature-art .emblem-fallback{position:absolute;inset:0;width:100%;height:100%;}
  .feature-art .poster-box{
    position:relative;z-index:2;flex:0 0 auto;
    width:clamp(120px,18vw,190px);aspect-ratio:2/3;
    border-radius:3px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.25);background:#1a1a1a;
  }
  .feature-art .poster-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .feature-art-meta{position:relative;z-index:2;flex:1 1 auto;display:flex;align-items:flex-end;min-width:0;}
  .index-counter{font-family:'Archivo Black';display:flex;align-items:baseline;gap:2px;background:rgba(255,255,255,.92);padding:6px 10px;flex:0 0 auto;}
  .index-counter .cur{font-size:28px;border-bottom:2px solid var(--ink);padding-bottom:2px;}
  .index-counter .tot{font-size:13px;color:var(--ink-faint);font-family:'Manrope';font-weight:800;}

  .feature-content{padding:clamp(24px,5vw,64px) clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;}
  .fc-dots{color:var(--ink-faint);letter-spacing:3px;font-size:14px;margin-bottom:18px;}
  .fc-tagrow{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .fc-tag{font-size:11px;font-weight:800;color:var(--ink-dim);letter-spacing:.03em;}
  .stars{display:flex;gap:2px;color:var(--ink);}
  .stars svg{width:12px;height:12px;}
  .stars .off{color:var(--line);}
  .fc-title{font-size:clamp(26px,4.2vw,50px);line-height:1.02;margin-bottom:22px;word-break:break-word;}
  .fc-actions{display:flex;align-items:center;gap:12px;margin-bottom:30px;flex-wrap:wrap;}

  .gallery-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);width:fit-content;}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;max-width:460px;}
  .info-cell{border-left:2px solid var(--line);padding-left:10px;}
  .info-cell b{display:block;font-size:14px;font-weight:800;}
  .info-cell span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-top:2px;}
  .fc-syn{color:var(--ink-dim);font-size:14px;line-height:1.7;max-width:480px;margin-top:22px;}

  section.rail{padding:44px clamp(20px,4vw,56px) 0;}
  .rail-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .rail-head h2{font-size:20px;}
  .rail-head .see-all{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--ink-faint);}
  .rail-head .see-all:hover{color:var(--accent);border-color:var(--accent);}
  .rail-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x proximity;}
  .rail-scroll::-webkit-scrollbar{display:none;}

  .card{flex:0 0 auto;width:172px;scroll-snap-align:start;display:flex;flex-direction:column;gap:9px;}
  .poster{position:relative;width:172px;height:236px;overflow:hidden;border:1px solid var(--line);background:var(--bg-1);}
  .poster .base{position:absolute;inset:0;}
  .poster .num{position:absolute;bottom:8px;left:9px;font-family:'Archivo Black';font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .poster .rating{position:absolute;top:8px;right:8px;background:#fff;border:1px solid var(--line-strong);padding:2px 7px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px;}
  .poster .play-ov{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s ease;}
  .card:hover .play-ov{opacity:1;}
  .play-ov svg{width:34px;height:34px;}
  .card-title{font-size:12.5px;font-weight:700;line-height:1.3;}
  .card-sub{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.02em;}

  .page-pad{padding:36px clamp(20px,4vw,56px) 64px;}
  .catalog-head h1{font-size:clamp(26px,4vw,40px);margin-bottom:6px;}
  .catalog-head p{color:var(--ink-faint);font-size:13px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;}
  .filters select{background:#fff;border:1px solid var(--line);color:var(--ink);padding:9px 12px;font-size:12px;font-weight:700;}
  .genre-pill{padding:8px 14px;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--ink-dim);background:#fff;text-transform:uppercase;letter-spacing:.03em;}
  .genre-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px;}
  .catalog-grid .poster{width:100%;height:0;padding-bottom:135%;}
  .catalog-grid .card{width:auto;}
  .empty-state{padding:60px 0;text-align:center;color:var(--ink-faint);}
  .empty-state h3{font-size:17px;color:var(--ink);margin-bottom:8px;font-family:'Archivo Black';}

  .section-pad{padding:0 clamp(20px,4vw,56px) 60px;}
  .ep-list{display:flex;flex-direction:column;max-width:860px;}
  .ep-row{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line);}
  .ep-row:hover{background:var(--bg-1);}
  .ep-num{font-family:'Archivo Black';font-size:20px;color:var(--ink-faint);}
  .ep-info b{font-size:13.5px;display:block;}
  .ep-info span{font-size:11.5px;color:var(--ink-faint);}
  .ep-progress-bar{height:2px;background:var(--line);margin-top:6px;width:180px;max-width:40vw;}
  .ep-progress-bar i{display:block;height:100%;background:var(--accent);}
  .ep-row .icon-round{width:30px;height:30px;}
  .ep-row .icon-round svg{width:11px;height:11px;}

  .player-wrap{display:grid;grid-template-columns:1fr 320px;}
  @media (max-width:860px){
    .player-wrap{grid-template-columns:1fr;}
    .sidebar-eps{max-height:60vh;border-left:none;border-top:1px solid var(--line);}
  }
  .stage{position:relative;aspect-ratio:16/9;background:#0a0a0a;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .stage .glow{position:absolute;inset:-20%;filter:blur(60px);opacity:.5;}
  .stage-bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(22px) brightness(.55);transform:scale(1.02);}
  .stage-tint{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.25), rgba(0,0,0,.7));}
  .stage-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.85);}
  .demo-badge{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;margin-top:2px;}
  .big-play{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;}
  .big-play svg{width:26px;height:26px;}
  .controls{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 16px 14px;background:linear-gradient(to top, rgba(0,0,0,.85), transparent);display:flex;flex-direction:column;gap:8px;}
  .seek{height:4px;background:rgba(255,255,255,.25);position:relative;cursor:pointer;}
  .seek i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);}
  .ctrl-row{display:flex;align-items:center;gap:14px;color:#fff;}
  .ctrl-row .spacer{flex:1;}
  .ctrl-row button{background:none;border:none;color:#fff;display:flex;}
  .time-txt{font-size:12px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85);}
  .next-ep-toast{position:absolute;bottom:70px;right:16px;z-index:4;background:#fff;border:1px solid var(--line);padding:14px;width:230px;display:none;}
  .next-ep-toast.show{display:block;}
  .next-ep-toast .ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .sidebar-eps{background:var(--bg-1);border-left:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 91px);}
  .sidebar-eps h3{padding:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--line);}
  .side-ep{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .side-ep.active{background:#fff;border-left:3px solid var(--accent);}
  .side-ep .thumb{height:40px;}
  .side-ep b{font-size:12px;display:block;margin-bottom:2px;}
  .side-ep span{font-size:10.5px;color:var(--ink-faint);}
  .below-player{padding:26px clamp(20px,4vw,56px);}

  .profile-head{display:flex;gap:18px;align-items:center;margin-bottom:32px;}
  .profile-head .avatar{width:64px;height:64px;font-size:22px;}
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .tab{padding:10px 2px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-color:var(--ink);}
  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);max-width:520px;}
  .settings-row span{font-size:13.5px;font-weight:600;}
  .settings-row small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:2px;}
  .toggle{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;border:none;}
  .toggle.on{background:var(--accent);}
  .toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s ease;}
  .toggle.on i{left:20px;}

  .auth-wrap{min-height:calc(100vh - 91px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--bg-1);}
  .auth-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);padding:34px;}
  .auth-card h1{font-size:24px;margin-bottom:6px;}
  .auth-card p.sub{color:var(--ink-faint);font-size:12.5px;margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);padding:11px 13px;font-size:14px;}
  .field input:focus{border-color:var(--ink);}
  .auth-submit{width:100%;justify-content:center;}
  .auth-alt{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .auth-alt::before,.auth-alt::after{content:"";flex:1;height:1px;background:var(--line);}
  .social-btn{width:100%;justify-content:center;background:#fff;border:1.5px solid var(--ink);color:var(--ink);margin-bottom:10px;}
  .switch-line{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:18px;}
  .switch-line a{color:var(--accent);font-weight:800;}

  .toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:12px 22px;font-size:12.5px;font-weight:700;z-index:200;transition:transform .25s ease;}
  .toast-msg.show{transform:translateX(-50%) translateY(0);}

  @media (max-width:760px){
    nav.mainnav{display:none;}
    .search-wrap{display:none;}
  }
  @media (max-width:480px){
    header.topbar{padding:14px 16px;gap:12px;}
    .brand b{font-size:16px;}
    .brand small{display:none;}
    .auth-card{padding:22px;}
    .fc-actions{gap:10px;}
    .fc-actions .btn{padding:10px 16px;font-size:11px;}
  }

  /* ---------- skeleton (carregando) ---------- */
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  .skeleton{background:linear-gradient(90deg, var(--bg-1) 25%, var(--bg-2) 37%, var(--bg-1) 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;}
  .skeleton-hero{width:100%;aspect-ratio:21/9;max-height:640px;}
  @media (max-width:640px){.skeleton-hero{aspect-ratio:4/3;}}
  .skeleton-row{display:flex;gap:16px;overflow:hidden;}
  .skeleton-card{flex:0 0 172px;height:236px;border-radius:2px;}
  .skeleton-line{border-radius:2px;}
  @media (prefers-reduced-motion: reduce){.skeleton{animation:none;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================
   KUROSHI — protótipo de site de streaming de anime
   Dados fictícios (nenhuma IP real) — front-end apenas.
   ===================================================== */

const GENRES = ["Ação","Fantasia","Aventura","Drama","Comédia","Ficção Científica","Romance","Sobrenatural","Esporte","Suspense"];

const GENRE_TONE = {
  "Ação": "#c8102e", "Fantasia":"#5b3fae", "Aventura":"#0f8b6c", "Drama":"#33517a",
  "Comédia":"#c78a12", "Ficção Científica":"#136d8a", "Romance":"#b23a63",
  "Sobrenatural":"#5a3a86", "Esporte":"#b5560f", "Suspense":"#4a4a4a"
};

function seededRand(seed){ let x = Math.sin(seed) * 10000; return x - Math.floor(x); }

/* Marca geométrica abstrata usada no lugar de arte de personagem
   (sem ilustrações reais de anime licenciadas) */
function emblemSvg(anime, seed){
  const tone = GENRE_TONE[anime.genres[0]] || "#111";
  const s = seed + anime.id.length*17;
  const capeSway = 8 + seededRand(s)*10;
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="body${s}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${tone}" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="${tone}" stop-opacity="0.55"/>
      </linearGradient>
      <radialGradient id="glow${s}"><stop offset="0%" stop-color="${tone}" stop-opacity="0.35"/><stop offset="100%" stop-color="${tone}" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="230" cy="230" r="200" fill="url(#glow${s})"/>
    <polygon points="200,60 340,150 340,260 200,340 60,260 60,150" fill="none" stroke="#111" stroke-opacity="0.06" stroke-width="2" transform="rotate(${(s%40)-20} 200 200)"/>
    <polygon points="200,60 340,150 340,260 200,340 60,260 60,150" fill="none" stroke="#111" stroke-opacity="0.04" stroke-width="1.5" transform="rotate(${(s%20)-10} 200 200) scale(0.7)" transform-origin="200 200"/>

    <line x1="120" y1="260" x2="300" y2="90" stroke="${tone}" stroke-width="10" stroke-linecap="round" opacity="0.18"/>
  </svg>`;
}

function sceneSvg(anime, seed){
  const tone = GENRE_TONE[anime.genres[0]] || "#111";
  const s = seed + anime.id.length*29;
  let lines=[];
  for(let i=0;i<5;i++){
    const y = seededRand(s+i)*100;
    lines.push(`<line x1="0" y1="${y}" x2="100" y2="${y-40+seededRand(s+i+2)*20}" stroke="#fff" stroke-opacity="0.06" stroke-width="2"/>`);
  }
  return `<svg viewBox="0 0 100 62" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="62" fill="#0d0d0d"/>
    <circle cx="${20+seededRand(s)*60}" cy="${20+seededRand(s+1)*25}" r="${18+seededRand(s+2)*14}" fill="${tone}" opacity="0.55"/>
    ${lines.join("")}
  </svg>`;
}

function animeIndex(id){ return ANIME.findIndex(a=>a.id===id)+1; }

/* Semente determinística a partir de qualquer id (mock ou de uma API real),
   usada pra gerar o emblema/cena sem depender do array ANIME local. */
function seedFromId(id){
  let h = 0;
  for(const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return h % 1000;
}

/* Todo anime que passa pela tela (card, destaque, detalhe...) é guardado
   aqui, pra favoritos/histórico conseguirem exibir os dados completos
   depois — inclusive quando o anime veio de uma API externa e não está
   no array ANIME local. */
const animeCache = {};
function cacheAnime(anime){ if(anime && anime.id) animeCache[anime.id] = anime; return anime; }
function resolveAnime(id){
  if(animeCache[id]) return animeCache[id];
  const local = findAnime(id);
  if(local) return local;
  const fav = state.favorites.find(f=>f.id===id);
  if(fav) return fav;
  const hist = state.history.find(h=>h.animeId===id);
  return (hist && hist.anime) || null;
}

   inglês, que é o idioma usado pelos nomes de gênero da Jikan/AniList. */
const GENRE_PT_TO_EN = {
  "Ação": "Action", "Fantasia": "Fantasy", "Aventura": "Adventure", "Drama": "Drama",
  "Comédia": "Comedy", "Ficção Científica": "Sci-Fi", "Romance": "Romance",
  "Sobrenatural": "Supernatural", "Esporte": "Sports", "Suspense": "Suspense"
};

/* =====================================================
   Camada de dados — três modos possíveis em CONFIG.DATA_SOURCE:

   "mock"     (padrão) catálogo fictício embutido — funciona sempre,
              inclusive dentro do preview do Claude, sem nenhuma rede.

   "jikan"    busca dados reais direto da Jikan API (MyAnimeList) a
              partir do PRÓPRIO NAVEGADOR — a Jikan libera CORS para
              qualquer origem, então isso funciona sozinho no GitHub
              Pages, sem precisar rodar nenhum backend. É o modo
              recomendado pro site publicado.

   "backend"  usa o backend Node deste repositório (pasta /backend),
              que por sua vez pode usar Jikan OU AniList (variável de
              ambiente PROVIDER do lado do servidor). Só funciona
              quando você roda/hospeda esse backend separadamente
              (GitHub Pages não roda Node).

   Nenhuma tela (Home, catálogo, detalhes, player) precisa mudar quando
   você troca de modo — todas conversam só com o objeto DataSource.
   ===================================================== */
const CONFIG = {
  DATA_SOURCE: "jikan", // "mock" | "jikan" | "backend"
  API_BASE_URL: "http://localhost:4000" // usado só quando DATA_SOURCE === "backend"
};

/* Implementação do modo "jikan": chama https://api.jikan.moe direto do
   navegador, com cache e fila simples pra respeitar o rate limit público
   (a Jikan libera Access-Control-Allow-Origin: * — dá pra confirmar com
   curl -I https://api.jikan.moe/v4/anime). */
const JikanDirect = (() => {
  const BASE = "https://api.jikan.moe/v4";
  const cache = new Map();
  const TTL_MS = 10 * 60 * 1000; // cache em memória, dura a navegação atual
  const PERSIST_TTL_MS = 25 * 60 * 1000; // cache em localStorage, sobrevive a recarregar a página
  const PERSIST_PREFIX = "kuroshi:jikan-cache:";
  let lastCall = 0;

  // Cache persistente é só uma otimização — qualquer falha aqui (modo
  // privado, quota cheia, localStorage bloqueado) é ignorada em silêncio.
  function persistGet(path){
    try{
      const raw = localStorage.getItem(PERSIST_PREFIX+path);
      if(!raw) return null;
      const hit = JSON.parse(raw);
      if(Date.now()-hit.time > PERSIST_TTL_MS) return null;
      return hit;
    }catch(e){ return null; }
  }
  function persistSet(path, json){
    try{ localStorage.setItem(PERSIST_PREFIX+path, JSON.stringify({value:json, time:Date.now()})); }
    catch(e){ /* ignora — não é crítico */ }
  }

  // Só serializa o ESPAÇAMENTO DE DISPARO entre requisições (evita 429
  // da Jikan: ~3 req/s), sem esperar a requisição anterior terminar.
  // Assim, 3 chamadas pedidas "ao mesmo tempo" (ex: os 3 carrosséis da
  // Home) ficam em voo simultaneamente, só com a largada espaçada — em
  // vez de uma esperar a outra terminar (o que triplicava o tempo de
  // carregamento da Home).
  let lastDispatch = 0;
  let dispatchGate = Promise.resolve();
  function reserveSlot() {
    const slot = dispatchGate.then(async () => {
      const wait = Math.max(0, 400 - (Date.now() - lastDispatch));
      if (wait > 0) await sleep(wait);
      lastDispatch = Date.now();
    });
    dispatchGate = slot.catch(() => {});
    return slot;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function fetchOnce(path) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3000); // timeout de 3s
    try {
      const res = await fetch(`${BASE}${path}`, { signal: ctrl.signal });
      if (!res.ok) {
        const e = new Error(`Jikan respondeu ${res.status}`);
        e.status = res.status;
        e.retryAfter = Number(res.headers.get("Retry-After")) || 0;
        throw e;
      }
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function call(path) {
    const hit = cache.get(path);
    if (hit && Date.now() - hit.time < TTL_MS) return hit.value;
    const persisted = persistGet(path);
    if (persisted) { cache.set(path, persisted); return persisted.value; }

    const MAX_TRIES = 4; // 1 tentativa + 3 reenvios
    for (let attempt = 1; ; attempt++) {
      await reserveSlot(); // só espera a vaga de disparo, não a requisição alheia terminar
      try {
        const json = await fetchOnce(path);
        cache.set(path, { value: json, time: Date.now() });
        persistSet(path, json);
        return json;
      } catch (err) {
        const retriable = err.name === "AbortError" || err.status === 429 ||
          (err.status >= 500 && err.status < 600);
        if (!retriable || attempt >= MAX_TRIES) throw err;
        // backoff exponencial + jitter; 429 também honra o Retry-After
        const backoff = err.retryAfter > 0 ? err.retryAfter * 1000
          : 800 * Math.pow(2, attempt - 1);
        await sleep(backoff + Math.random() * 250);
      }
    }
  }

  function normalize(a) {
    return {
      id: String(a.mal_id),
      title: a.title_english || a.title,
      alt: a.title_japanese || a.title,
      genres: (a.genres || []).map((g) => g.name),
      year: a.year || (a.aired && a.aired.prop && a.aired.prop.from && a.aired.prop.from.year) || null,
      rating: a.score || 0,
      status: a.airing ? "em exibição" : "finalizado",
      studio: (a.studios && a.studios[0] && a.studios[0].name) || "Desconhecido",
      eps: a.episodes || 0,
      synopsis: a.synopsis || "",
      cover: (a.images && a.images.jpg && a.images.jpg.large_image_url) || null,
      banner: (a.trailer && a.trailer.images && a.trailer.images.maximum_image_url) || null,
      source: "jikan",
    };
  }

  return {
    async top(page = 1) {
      const data = await call(`/top/anime?page=${page}&filter=bypopularity`);
      return (data.data || []).map(normalize);
    },
    async seasonal() {
      const data = await call(`/seasons/now`);
      return (data.data || []).map(normalize);
    },
    async recommended() {
      const data = await call(`/top/anime?page=2&filter=bypopularity`);
      return (data.data || []).slice(0, 8).map(normalize);
    },
    async search({ q = "", genre = "", status = "" }) {
      const params = new URLSearchParams({ limit: "24" });
      if (q) params.set("q", q);
      if (status === "em exibição") params.set("status", "airing");
      if (status === "finalizado") params.set("status", "complete");
      const data = await call(`/anime?${params.toString()}`);
      let results = (data.data || []).map(normalize);
      if (genre && genre !== "Todos") {
        const genreEn = GENRE_PT_TO_EN[genre] || genre;
        results = results.filter((a) => a.genres.includes(genreEn));
      }
      return results;
    },
    async byId(id) {
      const data = await call(`/anime/${id}/full`);
      return data.data ? normalize(data.data) : null;
    },
    async episodes(anime) {
      const fallback = () => Array.from({ length: Math.max(anime.eps || 0, 1) }, (_, i) => ({ numero: i + 1, titulo: null }));
      try {
        const data = await call(`/anime/${anime.id}/episodes`);
        const eps = (data.data || []).map((e) => ({ numero: e.mal_id, titulo: e.title || null }));
        return eps.length ? eps : fallback();
      } catch (e) { return fallback(); }
    },
  };
})();

const DataSource = {
  async top(){
    if(CONFIG.DATA_SOURCE === "jikan") return JikanDirect.top();
    if(CONFIG.DATA_SOURCE === "backend"){
      const r = await fetch(`${CONFIG.API_BASE_URL}/api/top`);
      if(!r.ok) throw new Error("Falha ao buscar 'Em alta'");
      return (await r.json()).results;
    }
    return [...ANIME].sort((a,b)=>b.rating-a.rating).slice(0,8);
  },
  async seasonal(){
    if(CONFIG.DATA_SOURCE === "jikan") return JikanDirect.seasonal();
    if(CONFIG.DATA_SOURCE === "backend"){
      const r = await fetch(`${CONFIG.API_BASE_URL}/api/seasonal`);
      if(!r.ok) throw new Error("Falha ao buscar lançamentos");
      return (await r.json()).results;
    }
    return ANIME.filter(a=>a.status==="em exibição");
  },
  async recommended(){
    if(CONFIG.DATA_SOURCE === "jikan") return JikanDirect.recommended();
    if(CONFIG.DATA_SOURCE === "backend"){
      const r = await fetch(`${CONFIG.API_BASE_URL}/api/search?page=2`);
      if(!r.ok) return [];
      return (await r.json()).results.slice(0,8);
    }
    return [...ANIME].slice().reverse().slice(0,8);
  },
  async search(filters){
    if(CONFIG.DATA_SOURCE === "jikan") return JikanDirect.search(filters);
    if(CONFIG.DATA_SOURCE === "backend"){
      const params = new URLSearchParams();
      if(filters.q) params.set("q", filters.q);
      if(filters.genre && filters.genre!=="Todos") params.set("genre", filters.genre);
      if(filters.status && filters.status!=="Todos") params.set("status", filters.status);
      const r = await fetch(`${CONFIG.API_BASE_URL}/api/search?${params.toString()}`);
      if(!r.ok) throw new Error("Falha na busca");
      return (await r.json()).results;
    }
    let list = ANIME.filter(a=>{
      if(filters.genre!=="Todos" && !a.genres.includes(filters.genre)) return false;
      if(filters.status!=="Todos" && a.status!==filters.status) return false;
      if(filters.q && !(a.title.toLowerCase().includes(filters.q.toLowerCase()) || a.alt.toLowerCase().includes(filters.q.toLowerCase()))) return false;
      return true;
    });
    if(filters.sort==="popularidade") list.sort((a,b)=>b.rating-a.rating);
    if(filters.sort==="ano") list.sort((a,b)=>b.year-a.year);
    if(filters.sort==="az") list.sort((a,b)=>a.title.localeCompare(b.title));
    return list;
  },
  async byId(id){
    if(CONFIG.DATA_SOURCE === "jikan") return JikanDirect.byId(id);
    if(CONFIG.DATA_SOURCE === "backend"){
      const r = await fetch(`${CONFIG.API_BASE_URL}/api/anime/${id}`);
      if(!r.ok) return null;
      return (await r.json()).result;
    }
    return findAnime(id) || null;
  },
  async episodes(anime){
    const fallback = () => Array.from({length: Math.max(anime.eps||0,1)}, (_,i)=>({numero:i+1, titulo:null}));
    if(CONFIG.DATA_SOURCE === "jikan") return JikanDirect.episodes(anime);
    if(CONFIG.DATA_SOURCE === "backend"){
      try{
        const r = await fetch(`${CONFIG.API_BASE_URL}/api/anime/${anime.id}/episodes`);
        if(!r.ok) return fallback();
        const data = await r.json();
        return (data.episodes && data.episodes.length) ? data.episodes : fallback();
      }catch(e){ return fallback(); }
    }
    return fallback();
  }
};

/* Cadastro/login "de verdade" no sentido de validar e-mail/senha contra

   listado no README do repositório. */

  create(user){ const list = this.all(); list.push(user); this.save(list); }

let state = {
  view: "home", params: {},
  favorites: store.get("favorites", []),
  history: store.get("history", []),
  user: store.get("user", null),
  catalogFilters: { genre: "Todos", status: "Todos", sort: "popularidade", q: "" }
};

function saveState(){ store.set("favorites", state.favorites); store.set("history", state.history); store.set("user", state.user); }

function go(view, params={}){ state.view = view; state.params = params; window.scrollTo({top:0, behavior:"instant"}); render(); }

function toast(msg){
  let el = document.querySelector(".toast-msg");
  if(!el){ el = document.createElement("div"); el.className = "toast-msg"; document.body.appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 2200);
}

function snapshotAnime(anime){
  return { id:anime.id, title:anime.title, alt:anime.alt, genres:anime.genres, year:anime.year,
    rating:anime.rating, status:anime.status, studio:anime.studio, eps:anime.eps,
    synopsis:anime.synopsis, cover:anime.cover, banner:anime.banner };
}

function toggleFavorite(id){
  const i = state.favorites.findIndex(f=>f.id===id);
  if(i>-1){ state.favorites.splice(i,1); toast("Removido dos favoritos"); }
  else {
    const anime = resolveAnime(id);
    if(!anime) return;
    state.favorites.push(snapshotAnime(anime));
    toast("Adicionado aos favoritos");
  }
  saveState(); render();
}
function isFavorite(id){ return state.favorites.some(f=>f.id===id); }

function recordProgress(anime, ep, progress){
  const animeId = anime.id;
  let entry = state.history.find(h=>h.animeId===animeId);
  const snap = snapshotAnime(anime);
  if(!entry){ entry = {animeId, ep, progress, anime:snap}; state.history.unshift(entry); }
  else { entry.ep = ep; entry.progress = progress; entry.anime = snap; state.history = [entry, ...state.history.filter(h=>h!==entry)]; }
  state.history = state.history.slice(0,20);
  saveState();
}

function starsRow(rating){
  const filled = Math.round(rating/2);
  let out = "";
  for(let i=0;i<5;i++) out += `<span class="${i<filled?'':'off'}">${ICO.starFull}</span>`;
  return `<div class="stars">${out}</div>`;
}

function posterMedia(anime){
  if(anime.cover){
    return `<img src="${anime.cover}" alt="${anime.title}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">`;
  }
  return emblemSvg(anime, seedFromId(anime.id)*3);
}

function card(anime){
  cacheAnime(anime);
  const ratingTxt = anime.rating ? anime.rating.toFixed(1) : "–";
  const epsTxt = anime.eps ? anime.eps : "?";
  const subTxt = (anime.genres && anime.genres.length) ? anime.genres.join(" / ") : (anime.year || "");
  return `<a class="card" href="#" onclick="go('detail',{id:'${anime.id}'});return false;">
    <div class="poster">
      <div class="base">${posterMedia(anime)}</div>
      <div class="rating">${ICO.starFull.replace('viewBox="0 0 24 24"','width="9" height="9" viewBox="0 0 24 24"')}${ratingTxt}</div>
      <div class="num">${epsTxt} eps</div>
      <div class="play-ov">${ICO.playOutline}</div>
    </div>
    <div class="card-title">${anime.title}</div>
    <div class="card-sub">${subTxt}</div>
  </a>`;
}

function rail(title, list, seeAllView){
  if(list.length===0) return "";
  return `<section class="rail">
    <div class="rail-head"><h2>${title}</h2>${seeAllView ? `<a class="see-all" href="#" onclick="go('${seeAllView}');return false;">Ver tudo</a>` : ""}</div>
    <div class="rail-scroll">${list.map(card).join("")}</div>
  </section>`;
}

function topNav(active){
  // "key" identifica o item pra destacar no menu (evita dois links ativos
  // ao mesmo tempo); "action" é o que acontece ao clicar. "Catálogo" e
  // "Em Alta" levam pra mesma tela, mas com key diferente — e "Em Alta"
  // agora também ordena por popularidade de verdade, em vez de ser um
  // link idêntico ao "Catálogo".
  const links = [
    { label:"Ajuda", key:"help", action:"toast('Em breve');return false;" },
    { label:"Catálogo", key:"catalog", action:"go('catalog');return false;" },
    { label:"Em Alta", key:"em-alta", action:"state.catalogFilters={genre:'Todos',status:'Todos',sort:'popularidade',q:''};go('catalog');return false;" },
    { label:"Sobre", key:"about", action:"toast('Em breve');return false;" },
  ];
  return `<header class="topbar">
    <a class="brand" href="#" onclick="go('home');return false;"><b>KUROSHI</b><small>ANIME STREAM</small></a>
    <nav class="mainnav">
      ${links.map(l=>`<a href="#" class="${active===l.key?'active':''}" onclick="${l.action}">${l.label}</a>`).join("")}
      <a href="#" class="${active==='home'?'active':''}" onclick="go('home');return false;">Início</a>
    </nav>
    <div class="topbar-actions">
      <div class="search-wrap">${ICO.search}
        <input type="text" placeholder="Buscar..." value="${state.catalogFilters.q||''}"
          onkeydown="if(event.key==='Enter'){ state.catalogFilters.q=this.value; go('catalog'); }">
      </div>
      ${state.user
        ? `<a href="#" onclick="go('profile');return false;" class="avatar" title="${state.user.name}">${state.user.name[0].toUpperCase()}</a>`
        : `<button class="btn btn-solid btn-sm" onclick="go('login')">Entrar</button>`}
      <button class="icon-sq" title="Início" onclick="go('home')">${ICO.home}</button>
    </div>
  </header>`;
}

function skeletonLoader(view){
  const cards = Array.from({length:6}, ()=>`<div class="skeleton skeleton-card"></div>`).join("");
  if(view==="home" || view==="detail" || view==="player"){
    return `
      <div class="skeleton skeleton-hero"></div>
      <div class="page-pad" style="padding-top:24px;">
        <div class="skeleton skeleton-line" style="width:140px;height:18px;margin-bottom:16px;"></div>
        <div class="skeleton-row">${cards}</div>
      </div>`;
  }
  return `<div class="page-pad">
    <div class="skeleton skeleton-line" style="width:220px;height:28px;margin-bottom:24px;"></div>
    <div class="catalog-grid">${Array.from({length:10},()=>`<div class="skeleton skeleton-card" style="width:100%;height:236px;"></div>`).join("")}</div>
  </div>`;
}

/* Ficha técnica rápida — troca a antiga "galeria" de miniaturas falsas
   (que não tínhamos como preencher com imagens reais) por dados de
   verdade vindos da própria API, sem risco de imagem quebrada. */
function infoPanel(anime){
  const cells = [
    { label:"Ano", value: anime.year || "—" },
    { label:"Episódios", value: anime.eps || "—" },
    { label:"Estúdio", value: anime.studio || "—" },
    { label:"Status", value: anime.status === "em exibição" ? "Em exibição" : "Finalizado" },
  ];
  return `<div class="info-grid">
    ${cells.map(c=>`<div class="info-cell"><b>${c.value}</b><span>${c.label}</span></div>`).join("")}
  </div>`;
}

/* Hero em duas camadas: fundo borrado (preenche qualquer formato de
   imagem sem esticar feio) + capa nítida numa caixa própria. Muito mais
   confiável que depender do "banner" de trailer da Jikan, que costuma
   faltar ou vir em baixíssima resolução. Sem capa real (modo mock),
   cai no emblema SVG gerado. */
function heroMedia(anime){
  const src = anime.cover;
  if(!src) return `<div class="emblem-fallback">${emblemSvg(anime, seedFromId(anime.id)*7)}</div>`;
  return `
    <img class="backdrop" src="${src}" alt="" aria-hidden="true" loading="lazy">
    <div class="backdrop-tint"></div>
    <div class="poster-box"><img src="${src}" alt="${anime.title}" loading="lazy"></div>
  `;
}

function featureBlock(anime, opts){
  opts = opts || {};
  cacheAnime(anime);
  const fav = isFavorite(anime.id);
  const hist = state.history.find(h=>h.animeId===anime.id);
  const genre = (anime.genres && anime.genres[0]) || "Anime";
  return `<section class="feature">
    <div class="feature-art">
      ${heroMedia(anime)}
      <div class="feature-art-meta">
        ${opts.indexLabel ? `<div class="index-counter"><span class="cur">${opts.indexLabel.cur}</span><span class="tot">${opts.indexLabel.tot}</span></div>` : ""}
      </div>
    </div>
    <div class="feature-content">
      <div class="fc-dots">•••</div>
      <div class="fc-tagrow">
        <span class="fc-tag">${opts.rankPrefix ? `#${opts.rankPrefix} ` : ""}${genre}</span>
        ${starsRow(anime.rating||0)}
      </div>
      <h1 class="fc-title">${anime.title}</h1>
      <div class="fc-actions">
        <button class="btn btn-solid" onclick="go('player',{id:'${anime.id}',ep:${hist?hist.ep:1}})">${ICO.play} ${hist?"Continuar":"Assistir"}</button>
        <button class="btn btn-outline" onclick="go('detail',{id:'${anime.id}'})">${ICO.check} Detalhes</button>
        <button class="icon-round ${fav?'on':''}" title="Favoritar" onclick="toggleFavorite('${anime.id}')">${ICO.heart(fav)}</button>
      </div>
      <div>
        <div class="gallery-label">Ficha técnica</div>
        ${infoPanel(anime)}
      </div>
      ${opts.showSynopsis ? `<p class="fc-syn">${anime.synopsis}</p>` : ""}
    </div>
  </section>`;
}

async function viewHome(){
  // allSettled: um carrossel falho não derruba a home inteira — mostramos
  // o que carregou e omitimos só o que falhou.
  const [rTop, rSeasonal, rRec] = await Promise.allSettled([
    DataSource.top(), DataSource.seasonal(), DataSource.recommended()
  ]);
  const emAlta       = rTop.status      === "fulfilled" ? rTop.value      : [];
  const lancamentos  = rSeasonal.status === "fulfilled" ? rSeasonal.value : [];
  const recomendados = rRec.status      === "fulfilled" ? rRec.value      : [];
  if (rTop.status      === "rejected") console.error("Falha em 'Em alta':", rTop.reason);
  if (rSeasonal.status === "rejected") console.error("Falha em 'Lançamentos':", rSeasonal.reason);
  if (rRec.status      === "rejected") console.error("Falha em 'Recomendados':", rRec.reason);
  if (!emAlta.length && !lancamentos.length && !recomendados.length) {
    throw (rTop.reason || rSeasonal.reason || rRec.reason || new Error("Sem dados"));
  }
  const featured = CONFIG.DATA_SOURCE==="mock" ? ANIME[3] : (emAlta[0] || lancamentos[0] || recomendados[0]);
  const continuar = state.history.map(h=>resolveAnime(h.animeId)).filter(Boolean);

  const indexLabel = CONFIG.DATA_SOURCE==="mock" ? {cur:String(animeIndex(featured.id)).padStart(2,'0'), tot:"/"+ANIME.length} : null;
  const rankPrefix = CONFIG.DATA_SOURCE==="mock" ? animeIndex(featured.id) : null;

  if(!featured){
    return `<div class="page-pad"><div class="empty-state"><h3>Nenhum anime encontrado</h3><p>Verifique a conexão com o backend em ${CONFIG.API_BASE_URL}.</p></div></div>`;
  }

  return `
  ${featureBlock(featured, {showSynopsis:true, indexLabel, rankPrefix})}
  ${continuar.length ? rail("Continuar assistindo", continuar) : ""}
  ${rail("Em alta", emAlta, "catalog")}
  ${rail("Lançamentos", lancamentos, "catalog")}
  ${rail("Recomendados para você", recomendados, "catalog")}
  <div style="height:40px"></div>`;
}

async function viewDetail(params){
  const a = await DataSource.byId(params.id);
  if(!a) return `<div class="page-pad"><div class="empty-state"><h3>Anime não encontrado</h3><p>Ele pode ter sido removido ou o backend está fora do ar.</p></div></div>`;
  cacheAnime(a);
  const episodes = await DataSource.episodes(a);
  const hist = state.history.find(h=>h.animeId===a.id);
  const indexLabel = CONFIG.DATA_SOURCE==="mock" ? {cur:String(animeIndex(a.id)).padStart(2,'0'), tot:"/"+ANIME.length} : null;
  const rankPrefix = CONFIG.DATA_SOURCE==="mock" ? animeIndex(a.id) : null;

  return `
  ${featureBlock(a, {showSynopsis:true, indexLabel, rankPrefix})}
  <div class="section-pad" style="padding-top:44px;">
    <h2 style="font-size:17px;margin-bottom:16px;letter-spacing:.02em;">Episódios</h2>
    <div class="ep-list">
      ${episodes.map(epObj=>{
        const n = epObj.numero;
        const isCurrent = hist && hist.ep===n;
        const progress = isCurrent ? Math.round(hist.progress*100) : (hist && n<hist.ep ? 100 : 0);
        return `<a href="#" class="ep-row" onclick="go('player',{id:'${a.id}',ep:${n}});return false;">
          <div class="ep-num">${String(n).padStart(2,'0')}</div>
          <div class="ep-info"><b>${epObj.titulo || ("Episódio "+n)}</b><span>~24 min · ${a.studio||""}</span>
            ${progress>0 ? `<div class="ep-progress-bar"><i style="width:${progress}%"></i></div>` : ""}
          </div>
          <div class="icon-round">${ICO.play}</div>
        </a>`;
      }).join("")}
    </div>
  </div>`;
}

let playerTimer = null;
/* Miniatura da barra lateral: usa um recorte da capa real quando existe
   (bem melhor que a cena abstrata), com fallback pro SVG gerado. */
function sidebarThumb(anime){
  if(anime.cover) return `<img src="${anime.cover}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">`;
  return sceneSvg(anime, seedFromId(anime.id)*17);
}

async function viewPlayer(params){
  const a = await DataSource.byId(params.id);
  if(!a) return `<div class="page-pad"><div class="empty-state"><h3>Anime não encontrado</h3><p>Ele pode ter sido removido ou o backend está fora do ar.</p></div></div>`;
  cacheAnime(a);
  // Lista real de episódios (com título quando a API tem) — evita o bug de
  // travar em animes com contagem de episódios ainda desconhecida (comum
  // em séries em exibição, onde `eps` vem null até a temporada acabar).
  const episodes = await DataSource.episodes(a);
  const totalKnown = episodes.length || 1;
  const ep = Math.min(Math.max(1, params.ep||1), totalKnown);
  const tone = GENRE_TONE[(a.genres&&a.genres[0])] || "#444";
  const hist = state.history.find(h=>h.animeId===a.id);
  const startProgress = (hist && hist.ep===ep) ? hist.progress : 0;
  const shownEps = episodes.slice(0, 100);

  setTimeout(()=>initPlayer(a, ep, startProgress, totalKnown), 0);

  return `
  <div class="player-wrap">
    <div>
      <div class="stage" id="stage">
        ${a.cover
          ? `<img class="stage-bg" src="${a.cover}" alt="" aria-hidden="true" loading="lazy"><div class="stage-tint"></div>`
          : `<div class="glow" style="background:${tone}"></div>`}
        <div class="stage-center" id="stageCenter">
          <button class="big-play" onclick="playerToggle()">${ICO.playBig}</button>
          <div style="font-size:13px;color:rgba(255,255,255,.85);text-align:center;padding:0 20px;">${a.title} — Episódio ${ep}</div>
          <div class="demo-badge">Demonstração — sem vídeo real, reprodução acelerada</div>
        </div>
        <div class="next-ep-toast" id="nextToast">
          <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;"><div class="ring"></div><b style="font-size:13px;">Próximo episódio em breve</b></div>
          <div style="font-size:12px;color:var(--ink-faint);margin-bottom:10px;">Episódio ${ep+1} começa automaticamente.</div>
          <button class="btn btn-sm btn-outline" style="width:100%;justify-content:center;" onclick="cancelAutoplay()">Cancelar</button>
        </div>
        <div class="controls" id="controls">
          <div class="seek" id="seek" onclick="playerSeek(event)"><i id="seekFill" style="width:${startProgress*100}%"></i></div>
          <div class="ctrl-row">
            <button onclick="playerSkip(-1)" title="Episódio anterior">${ICO.prev}</button>
            <button onclick="playerToggle()" id="playPauseBtn">${ICO.playBig}</button>
            <button onclick="playerSkip(1)" title="Próximo episódio">${ICO.next}</button>
            <span class="time-txt" id="timeTxt">0:00 / 24:00</span>
            <span class="spacer"></span>
            <button title="Volume">${ICO.vol}</button>
            <button title="Tela cheia">${ICO.full}</button>
          </div>
        </div>
      </div>
      <div class="below-player">
        <h1 style="font-size:21px;margin-bottom:6px;">${a.title}</h1>
        <p style="color:var(--ink-faint);font-size:12.5px;margin-bottom:16px;">Episódio ${ep} de ${totalKnown}${a.eps ? "" : "+"} · ${(a.genres||[]).join(" / ")}</p>
        <p style="color:var(--ink-dim);font-size:14px;line-height:1.6;max-width:700px;">${a.synopsis || "Sem sinopse disponível."}</p>
        <div style="margin-top:18px;display:flex;gap:12px;">
          <button class="btn btn-outline btn-sm" onclick="toggleFavorite('${a.id}')">${ICO.heart(isFavorite(a.id))} ${isFavorite(a.id)?"Nos favoritos":"Favoritar"}</button>
          <button class="btn btn-outline btn-sm" onclick="go('detail',{id:'${a.id}'})">Ver detalhes</button>
        </div>
      </div>
    </div>
    <div class="sidebar-eps">
      <h3>Episódios — ${a.title}</h3>
      ${shownEps.map(epObj=>{
        const n = epObj.numero;
        return `<a href="#" class="side-ep ${n===ep?'active':''}" onclick="go('player',{id:'${a.id}',ep:${n}});return false;">
          <div class="thumb">${sidebarThumb(a)}</div>
          <div><b>${epObj.titulo || ("Episódio "+n)}</b><span>${n===ep?"Assistindo agora":"~24 min"}</span></div>
        </a>`;
      }).join("")}
      ${episodes.length>100 ? `<div style="padding:14px 16px;font-size:11px;color:var(--ink-faint);">Mostrando os 100 primeiros episódios.</div>` : ""}
    </div>
  </div>`;
}

function initPlayer(anime, ep, startProgress, totalEps){
  clearInterval(playerTimer);
  const totalSeconds = 24*60;
  let seconds = Math.floor(startProgress*totalSeconds);
  window._player = { playing:false, seconds, totalSeconds, anime, ep, totalEps: totalEps||null };

  function fmt(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return `${m}:${String(r).padStart(2,'0')}`; }
  function updateUI(){
    const fill = document.getElementById("seekFill");
    const txt = document.getElementById("timeTxt");
    if(fill) fill.style.width = (window._player.seconds/window._player.totalSeconds*100)+"%";
    if(txt) txt.textContent = `${fmt(window._player.seconds)} / ${fmt(window._player.totalSeconds)}`;
    recordProgress(anime, ep, window._player.seconds/window._player.totalSeconds);
  }
  window._player.updateUI = updateUI; // exposto pra playerSeek conseguir chamar
  updateUI();

  playerTimer = setInterval(()=>{
    if(!window._player.playing) return;
    window._player.seconds += 1;
    if(window._player.seconds >= window._player.totalSeconds){
      window._player.seconds = window._player.totalSeconds;
      window._player.playing = false;
      updateUI();
      triggerNextEpisode();
      return;
    }
    updateUI();
  }, 1000/8); // acelerado de propósito: 24min "assistidos" em ~3min reais
}

function playerToggle(){
  if(!window._player) return;
  window._player.playing = !window._player.playing;
  const center = document.getElementById("stageCenter");
  const btn = document.getElementById("playPauseBtn");
  if(window._player.playing){ if(center) center.style.display = "none"; if(btn) btn.innerHTML = ICO.pause; }
  else { if(center) center.style.display = "flex"; if(btn) btn.innerHTML = ICO.playBig; }
}
function playerSeek(e){
  if(!window._player) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width));
  window._player.seconds = Math.floor(pct * window._player.totalSeconds);
  if(window._player.updateUI) window._player.updateUI(); // corrige: antes só refletia no próximo tick do timer
}
function playerSkip(dir){
  const { anime:a, ep, totalEps } = window._player;
  const nextEp = Math.max(1, ep+dir);
  go('player', {id:a.id, ep: totalEps ? Math.min(totalEps, nextEp) : nextEp});
}
let autoplayTimer = null;
function triggerNextEpisode(){
  const { anime:a, ep, totalEps } = window._player;
  if(totalEps && ep >= totalEps) return; // contagem desconhecida: sempre deixa tentar o próximo
  const toastEl = document.getElementById("nextToast");
  if(toastEl) toastEl.classList.add("show");
  autoplayTimer = setTimeout(()=>{ go('player',{id:a.id, ep:ep+1}); }, 6000);
}
function cancelAutoplay(){
  clearTimeout(autoplayTimer);
  const toastEl = document.getElementById("nextToast");
  if(toastEl) toastEl.classList.remove("show");
}

function viewProfile(){
  if(!state.user){
    return `<div class="page-pad"><div class="empty-state"><h3>Você ainda não entrou</h3><p>Entre na sua conta para ver histórico e favoritos.</p>
    <div style="margin-top:16px"><button class="btn btn-solid" onclick="go('login')">Entrar</button></div></div></div>`;
  }
  const tab = state.params.tab || "historico";
  const histItems = state.history.map(h=>({...h, anime:resolveAnime(h.animeId)})).filter(h=>h.anime);
  const favItems = state.favorites;

  function tabBtn(id,label){ return `<a href="#" class="tab ${tab===id?'active':''}" onclick="go('profile',{tab:'${id}'});return false;">${label}</a>`; }

  let body = "";
  if(tab==="historico"){
    body = histItems.length ? `<div class="catalog-grid">${histItems.map(h=>card(h.anime)).join("")}</div>` : `<div class="empty-state"><h3>Sem histórico ainda</h3><p>Os episódios que você assistir aparecem aqui.</p></div>`;
  } else if(tab==="favoritos"){
    body = favItems.length ? `<div class="catalog-grid">${favItems.map(card).join("")}</div>` : `<div class="empty-state"><h3>Nenhum favorito ainda</h3><p>Toque no coração de um anime para guardá-lo aqui.</p></div>`;
  } else {
    body = `
      <div class="settings-row"><div><span>Reprodução automática</span><small>Ir para o próximo episódio automaticamente</small></div><button class="toggle on" onclick="this.classList.toggle('on')"><i></i></button></div>
      <div class="settings-row"><div><span>Legendas por padrão</span><small>Português (Brasil)</small></div><button class="toggle on" onclick="this.classList.toggle('on')"><i></i></button></div>
      <div class="settings-row"><div><span>Notificações de novos episódios</span><small>Somente para animes favoritados</small></div><button class="toggle on" onclick="this.classList.toggle('on')"><i></i></button></div>
      <div style="margin-top:24px;"><button class="btn btn-outline" onclick="doLogout()">Sair da conta</button></div>`;
  }

  return `<div class="page-pad">
    <div class="profile-head"><div class="avatar">${state.user.name[0].toUpperCase()}</div>
      <div><h1 style="font-size:22px;">${state.user.name}</h1><p style="color:var(--ink-faint);font-size:12.5px;">${state.user.email}</p></div></div>
    <div class="tabs">${tabBtn("historico","Histórico")}${tabBtn("favoritos","Favoritos")}${tabBtn("config","Configurações")}</div>
    ${body}
  </div>`;
}

function viewAuth(){
  const mode = state.params.mode || "login";
  return `<div class="auth-wrap"><div class="auth-card">
      <h1>${mode==="login"?"Bem-vindo de volta":"Criar conta"}</h1>
      <p class="sub">${mode==="login"?"Entre para continuar de onde parou.":"Leva menos de um minuto."}</p>
      <form onsubmit="return doAuthSubmit(event,'${mode}')">
        ${mode==="cadastro" ? `<div class="field"><label>Nome</label><input required name="name" type="text" placeholder="Seu nome"></div>` : ""}
        <div class="field"><label>E-mail</label><input required name="email" type="email" placeholder="voce@email.com"></div>
        <div class="field"><label>Senha</label><input required name="password" type="password" placeholder="••••••••" minlength="4"></div>
        <div id="authError" style="display:none;color:var(--accent);font-size:12.5px;font-weight:700;margin:-6px 0 14px;"></div>
        <button class="btn btn-solid auth-submit" type="submit">${mode==="login"?"Entrar":"Criar conta"}</button>
      </form>
      <div class="auth-alt">ou continue com</div>
      <button class="btn social-btn" onclick="doSocialLogin()">Continuar com Google</button>
      <p class="switch-line">${mode==="login" ? `Não tem conta? <a href="#" onclick="go('login',{mode:'cadastro'});return false;">Cadastre-se</a>` : `Já tem conta? <a href="#" onclick="go('login',{mode:'login'});return false;">Entrar</a>`}</p>
      <p style="text-align:center;font-size:10.5px;color:var(--ink-faint);margin-top:16px;">Conta salva apenas neste navegador — projeto de portfólio, sem servidor de autenticação real.</p>
  </div></div>`;
}
function showAuthError(msg){
  const el = document.getElementById("authError");
  if(el){ el.textContent = msg; el.style.display = "block"; }
  else toast(msg);
}
function doAuthSubmit(e, mode){
  e.preventDefault();
  const f = new FormData(e.target);
  const email = (f.get("email")||"").trim();
  const password = f.get("password")||"";
  const name = (f.get("name")||"").trim();

  if(mode==="cadastro"){
    if(usersStore.findByEmail(email)){
      showAuthError("Já existe uma conta com esse e-mail. Tente entrar.");
      return false;
    }
    usersStore.create({ name: name || email.split("@")[0], email, password });
    state.user = { name: name || email.split("@")[0], email };
    saveState(); toast("Conta criada"); go("home");
    return false;
  }

  // login
  const found = usersStore.findByEmail(email);
  if(!found){
    showAuthError("Não achamos essa conta. Que tal se cadastrar?");
    return false;
  }
  if(found.password !== password){
    showAuthError("Senha incorreta.");
    return false;
  }
  state.user = { name: found.name, email: found.email };
  saveState(); toast("Login realizado"); go("home");
  return false;
}
function doSocialLogin(){
  const email = "convidado@gmail.com";
  if(!usersStore.findByEmail(email)) usersStore.create({ name:"Convidado Google", email, password:null });
  state.user = { name:"Convidado Google", email };
  saveState(); toast("Login com Google realizado"); go("home");
}
function doLogout(){ state.user = null; saveState(); toast("Você saiu da conta"); go("home"); }

let renderToken = 0;
async function render(){
  clearInterval(playerTimer);
  const myToken = ++renderToken;
  let v = state.view;

  // já logado não precisa ver a tela de login/cadastro
  if(v==="login" && state.user){ v = "profile"; state.view = "profile"; }

  document.getElementById("app").innerHTML = `${topNav(v)}<main>${skeletonLoader(v)}</main>`;

  let body = "";
  try{
    if(v==="home") body = await viewHome();
    else if(v==="catalog") body = await viewCatalog();
    else if(v==="detail") body = await viewDetail(state.params);
    else if(v==="player") body = await viewPlayer(state.params);
    else if(v==="profile") body = viewProfile();
    else if(v==="login") body = viewAuth();
    else body = await viewHome();
  }catch(err){
    console.error(err);
    body = `<div class="page-pad"><div class="empty-state"><h3>Não deu pra carregar os dados</h3><p>${
      CONFIG.DATA_SOURCE==="backend" ? `Verifique se o backend está rodando em ${CONFIG.API_BASE_URL}.`
      : CONFIG.DATA_SOURCE==="jikan" ? "A Jikan API pode estar fora do ar ou com limite de requisições atingido. Tente novamente em instantes."
      : "Tente novamente em instantes."
    }</p><button onclick="render()" style="margin-top:16px;padding:10px 22px;background:#111;color:#fff;border:none;font-weight:700;font-family:inherit;letter-spacing:.04em;cursor:pointer;">Tentar novamente</button></div></div>`;
  }

  if(myToken !== renderToken) return; // uma navegação mais nova já aconteceu
  document.getElementById("app").innerHTML = `${topNav(v)}<main>${body}</main>${v!=="player" ? siteFooter() : ""}`;
}

render();
</script>
</body>
</html>
